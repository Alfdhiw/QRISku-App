<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" rx="24" fill="#F0F7FF"/>
  <!-- Decorative background circles -->
  <circle cx="200" cy="150" r="110" fill="#DBEAFE" opacity="0.6"/>
  <circle cx="200" cy="150" r="80" fill="#BFDBFE" opacity="0.5"/>
  
  <!-- Smartphone Container -->
  <rect x="140" y="45" width="120" height="210" rx="20" fill="#0F172A"/>
  <rect x="145" y="52" width="110" height="196" rx="15" fill="#FFFFFF"/>
  
  <!-- Screen Elements -->
  <!-- Top Bar -->
  <rect x="175" y="58" width="50" height="5" rx="2.5" fill="#E2E8F0"/>
  
  <!-- DANA Payment Notification Card Pop up -->
  <g filter="drop-shadow(0px 8px 16px rgba(37,99,235,0.25))">
    <rect x="115" y="95" width="170" height="85" rx="14" fill="#2563EB"/>
    <!-- App source badge -->
    <rect x="127" y="107" width="58" height="16" rx="8" fill="#1D4ED8"/>
    <text x="135" y="119" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">DANA Bisnis</text>
    <text x="195" y="119" font-family="sans-serif" font-size="8" fill="#DBEAFE">Baru saja</text>
    
    <!-- Title & Amount -->
    <text x="127" y="137" font-family="sans-serif" font-size="11" font-weight="500" fill="#DBEAFE">Pembayaran Masuk</text>
    <text x="127" y="162" font-family="sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">Rp29.000</text>
    
    <!-- Speaker Voice Icon on Notification -->
    <circle cx="260" cy="142" r="15" fill="#1D4ED8"/>
    <path d="M255 138 L259 135 L259 149 L255 146 L253 146 L253 138 Z" fill="#FFFFFF"/>
    <path d="M263 139 C264.5 141 264.5 143 263 145" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Voice Waves Emitting from phone -->
  <path d="M295 120 C310 130 310 155 295 165" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M312 108 C332 124 332 162 312 178" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M328 98 C354 118 354 172 328 192" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.4"/>
  
  <!-- Merchant Icon / Bag / Coin accent -->
  <circle cx="85" cy="185" r="28" fill="#FFFFFF" filter="drop-shadow(0px 4px 10px rgba(0,0,0,0.06))"/>
  <path d="M78 185 L85 178 L92 185 M85 178 L85 194" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="85" cy="186" r="18" stroke="#16A34A" stroke-width="2.5" fill="none"/>
</svg>